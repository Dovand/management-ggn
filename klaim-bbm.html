<script>
let globalSheetsData = [];
let globalMode = 'single';
let globalPeriode = '';

// Helper Hari & Tanggal Indonesia
function parseTicketDate(val) {
  if (!val) return new Date();
  if (typeof val === 'string' && /^\d{4}-\d{2}-\d{2}/.test(val)) {
    const [y, m, d] = val.substring(0, 10).split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  return (val instanceof Date) ? val : new Date(val);
}

function getHariIndo(d) {
  const dateObj = parseTicketDate(d);
  const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  return days[dateObj.getDay()] || '-';
}

function getTglIndo(d) {
  const dateObj = parseTicketDate(d);
  const bln = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  return `${dateObj.getDate()} ${bln[dateObj.getMonth()]} ${dateObj.getFullYear()}`;
}

// Helper Format Lokasi (HANYA LOKASI / WILAYAH — TIDAK MENCANTUMKAN ODP)
function extractLokasi(t) {
  if (!t) return '-';
  const wil = (t.wilayahpelanggan || '').trim();
  const alm = (t.alamat || '').trim();

  function cleanLokasiText(str) {
    if (!str || str === '-') return '';
    return str.replace(/ODP[\s\-_]*[A-Z0-9\-_]*/gi, '').replace(/^[\s\-_|,/]+|[\s\-_|,/]+$/g, '').trim();
  }

  const cleanWil = cleanLokasiText(wil);
  if (cleanWil && cleanWil !== '-') return cleanWil;
  if (wil && wil !== '-' && !/^ODP/i.test(wil)) return wil;

  const cleanAlm = cleanLokasiText(alm);
  if (cleanAlm && cleanAlm !== '-' && !/^ODP/i.test(cleanAlm)) return cleanAlm;

  return '-';
}

// Helper Format Multi Lokasi: HANYA WILAYAH / LOKASI (TANPA ODP)
function extractLokasiMulti(t) {
  if (!t) return ['-'];
  const locs = [];
  const wil = (t.wilayahpelanggan || '').trim();
  const alm = (t.alamat || '').trim();

  // 1. Wilayah / Lokasi
  if (wil && wil !== '-') {
    const parts = wil.split(/\s*\|\s*|\s*,\s*/).map(s => s.trim()).filter(Boolean);
    parts.forEach(p => {
      if (!/^ODP/i.test(p)) {
        const clean = p.replace(/ODP[\s\-_]*[A-Z0-9\-_]*/gi, '').replace(/^[\s\-_|,/]+|[\s\-_|,/]+$/g, '').trim();
        const finalP = clean || p;
        if (finalP && !/^ODP/i.test(finalP) && !locs.includes(finalP)) {
          locs.push(finalP);
        }
      }
    });
  }

  // 2. Alamat (hanya jika wilayah tidak ada, dan bersihkan dari teks ODP)
  if (locs.length === 0 && alm && alm !== '-') {
    const cleanAlm = alm.replace(/ODP[\s\-_]*[A-Z0-9\-_]*/gi, '').replace(/^[\s\-_|,/]+|[\s\-_|,/]+$/g, '').trim();
    if (cleanAlm && cleanAlm !== '-' && !/^ODP/i.test(cleanAlm)) {
      locs.push(cleanAlm);
    }
  }

  if (locs.length === 0) return ['-'];
  return locs;
}

// Helper pemecah teks panjang menjadi 2 baris tabel
function splitTextTwoLines(text, maxChars) {
  const str = String(text || '').trim();
  if (!str || str === '-') return { line1: str || '-', line2: '', isSplit: false };

  if (str.length <= maxChars) {
    return { line1: str, line2: '', isSplit: false };
  }

  let cut = str.lastIndexOf(' ', maxChars);
  if (cut < 4) cut = str.lastIndexOf('-', maxChars);
  if (cut < 4) cut = str.lastIndexOf('/', maxChars);
  if (cut < 4) cut = maxChars;

  const l1 = str.substring(0, cut).trim();
  const l2 = str.substring(cut).trim().replace(/^[\s\-_/]+/, '');
  return { line1: l1 || str, line2: l2 || '', isSplit: !!l2 };
}

// Helper Format Multi Lokasi: Jika ada banyak lokasi atau isian berlebih, pecah jadi baris 1 & baris 2
function getLokasiSplit(t) {
  if (!t) return { line1: '-', line2: '', isSplit: false };
  const locList = extractLokasiMulti(t);

  // Jika ada multi-lokasi wilayah
  if (locList.length > 1) {
    const loc1 = locList[0];
    const loc2 = locList.slice(1).join(' / ');
    return { line1: loc1, line2: loc2, isSplit: true };
  }

  const text = (locList[0] || '-').trim();
  return splitTextTwoLines(text, 18);
}

// Helper ID Pelanggan: ISI KODE ATAU NAMA PELANGGAN (JANGAN 000, 000 BUKAN ID/NAMA PELANGGAN)
function extractKodePlg(t) {
  if (!t) return '-';

  const rawKode = String(t.kodePelanggan || t.kodepelanggan || '').trim();
  const rawCust = String(t.customer || t.namapelanggan || t.namaPelanggan || t.nama || '').trim();

  // Helper untuk cek apakah sebuah nilai adalah dummy nol (0, 00, 000, 0000, dst)
  function isDummyZero(val) {
    if (!val || val === '-' || val.toLowerCase() === 'null' || val.toLowerCase() === 'undefined') return true;
    const clean = val.replace(/[\s\/\-_]/g, '');
    return /^0+$/.test(clean);
  }

  // Khusus PROJECT: tampilkan pekerjaan / nama project jika ada
  const jenis = String(t.jenistiket || t.jenisgangguan || t.jenis || '').toUpperCase().trim();
  const isProject = jenis === 'PROJECT' || String(t.ticketid || '').toUpperCase().startsWith('PRJ');
  if (isProject) {
    if (rawCust && !isDummyZero(rawCust)) return rawCust;
    if (rawKode && !isDummyZero(rawKode)) return rawKode;
    return '-';
  }

  // Helper untuk mendapatkan nama customer yang valid (bukan dummy nol / strip)
  function getValidCustomer(name) {
    if (!name || isDummyZero(name) || name === '-' || name.toLowerCase() === 'null' || name.toLowerCase() === 'undefined') {
      return '';
    }
    return name;
  }

  const validCust = getValidCustomer(rawCust);

  // 1. Cek jika rawKode adalah dummy nol (misal "000", "000/GAMAS", "000/RTL", "0")
  if (isDummyZero(rawKode) || /^000(\/|$)/i.test(rawKode)) {
    // JANGAN GUNAKAN 000! Gunakan nama pelanggan
    return validCust || '-';
  }

  // 2. Format {KODE_ANGKA}/RTL/... -> ambil angkanya saja jika bukan dummy nol
  const numRtlMatch = rawKode.match(/^(\d+)\s*\/\s*RTL/i);
  if (numRtlMatch) {
    const num = numRtlMatch[1];
    if (!isDummyZero(num)) return num;
  }

  // 3. Jika hanya angka murni (misal: "1234") -> ambil jika bukan dummy nol
  if (/^\d+$/.test(rawKode)) {
    if (!isDummyZero(rawKode)) return rawKode;
  }

  // 4. Format {NAMA}/RTL/... -> ambil nama pelanggannya
  const nameRtlMatch = rawKode.match(/^([^\/]+)\s*\/\s*RTL/i);
  if (nameRtlMatch) {
    const front = nameRtlMatch[1].trim();
    if (validCust) return validCust;
    if (!isDummyZero(front)) return front;
  }

  // 5. Cek apakah ada nomor ID pelanggan valid di dalam teks (misal "GGN-123", "PLG-45")
  const m = rawKode.match(/\d+/);
  if (m && !isDummyZero(m[0])) {
    return m[0];
  }

  // 6. Jika kode tidak valid atau bukan angka, prioritaskan nama pelanggan
  if (validCust) {
    return validCust;
  }

  // 7. Jika rawKode bukan dummy nol, tampilkan rawKode
  if (rawKode && !isDummyZero(rawKode)) {
    return rawKode;
  }

  return '-';
}

// ============================================================
// RENDER 1 KUPON FORM (VOUCHER)
// 10 BARIS TIKET, KEBUTUHAN 1-3, PETUGAS 1-2, TTD NOC DI BAWAH SENDIRI
// ============================================================
function renderVoucherHtml(vData, index) {
  const hari = vData.hari || '-';
  const tgl = vData.tanggal || '-';
  const tickets = vData.tickets || [];
  const kebutuhans = vData.kebutuhan || [];
  const petugas = vData.petugas || [];

  // Buat 10 baris tiket (jika ada banyak lokasi / isian berlebih pada 1 tiket, jadikan 2 baris dengan rowspan=2)
  let ticketRowsHtml = '';
  let rowCount = 0;
  const MAX_ROWS = 10;

  for (let i = 0; i < tickets.length && rowCount < MAX_ROWS; i++) {
    const t = tickets[i];

    // 1. Nomor Tiket
    const jenis = String(t.jenistiket || t.jenisgangguan || t.jenis || '').toUpperCase().trim();
    const isProject = jenis === 'PROJECT' || String(t.ticketid || '').toUpperCase().startsWith('PRJ');
    const fullTicketId = (t.ticketid && t.ticketid !== '-') ? t.ticketid : (isProject ? 'PROJECT' : (t.ticketid || '-'));
    const tIdSplit = splitTextTwoLines(fullTicketId, 13);

    // 2. ID / Nama Pelanggan
    const fullPlg = extractKodePlg(t);
    const plgSplit = splitTextTwoLines(fullPlg, 13);

    // 3. Lokasi
    const locSplit = getLokasiSplit(t);
    const fullLoc = locSplit.line2 ? `${locSplit.line1} / ${locSplit.line2}` : locSplit.line1;

    // Jika ada tulisan yang terlalu panjang, turunkan ke baris kedua (pakai 2 baris tabel tanpa garis pemisah)
    const needsTwoRows = (tIdSplit.isSplit || plgSplit.isSplit || locSplit.isSplit);

      // PAKAI 2 BARIS TABEL: SELURUH SEL MENGGUNAKAN ROWSPAN="2"

      const tIdContent = tIdSplit.isSplit ? `${tIdSplit.line1}<br>${tIdSplit.line2}` : fullTicketId;
      const plgContent = plgSplit.isSplit ? `${plgSplit.line1}<br>${plgSplit.line2}` : fullPlg;
      const locContent = locSplit.isSplit ? `${locSplit.line1}<br>${locSplit.line2}` : locSplit.line1;

      ticketRowsHtml += `
        <tr class="row-tiket-data">
          <td rowspan="2" class="td-tiket-cell" contenteditable="true"><strong>${tIdContent}</strong></td>
          <td colspan="2" rowspan="2" class="td-plg-cell" contenteditable="true" title="${fullPlg}">${plgContent}</td>

        </tr>
        <tr class="row-tiket-data" style="height:14px;"></tr>`;

        <tr class="row-tiket-data">

  // Kebutuhan 1, 2, 3

  const keb3 = kebutuhans[2] || '';

    <div class="voucher-box" id="voucher-${index}">

          <div class="kop-phone" contenteditable="true">Lumajang ( 0821 3926 4405 )</div>
        </div>
      </div>

      <!-- TABEL TIKET & KEBUTUHAN -->
      <table class="voucher-table">
        <colgroup>
          <col style="width: 26%;">
          <col style="width: 6%;">
          <col style="width: 20%;">
          <col style="width: 48%;">
        </colgroup>
        <!-- BARIS HARI & TGL -->
        <tr class="row-hari-tgl">
          <td colspan="2" class="cell-hari">HARI : <span contenteditable="true">${hari}</span></td>
          <td colspan="2" class="cell-tgl">TGL : <span contenteditable="true">${tgl}</span></td>

        <!-- HEADER TIKET (UKURAN ID PELANGGAN SAMA DENGAN ID TIKET = 26%) -->

// RENDER 1 LEMBAR A4 (MEMUAT MAKSIMAL 4 KUPON GRID 2x2)
// HANYA MUNCULKAN FORM JIKA ADA TEKNISI/TIKETNYA (SLOT KOSONG DIBIARKAN BERSIH)
// ============================================================
function renderA4Sheet(vouchers4, sheetIndex, totalSheets) {
  let innerVouchers = '';
  for (let i = 0; i < 4; i++) {
    const v = vouchers4[i];
    if (v && ((v.petugas && v.petugas.length > 0 && v.petugas[0] && v.petugas[0] !== '-') || (v.tickets && v.tickets.length > 0))) {
      innerVouchers += renderVoucherHtml(v, `${sheetIndex}-${i}`);
    } else {
      // Slot kosong: biarkan kosong bersih (jika hanya 3 tim, form ke-4 tidak muncul)
      innerVouchers += `<div class="voucher-box-empty" id="empty-${sheetIndex}-${i}"></div>`;
    }
  }

  return `
    <div class="klaim-sheet" id="sheet-${sheetIndex}">
      <div class="cut-guide-v no-print"></div>
      <div class="cut-guide-h no-print"></div>
      ${innerVouchers}
    </div>
  `;
}

// ============================================================
// INIT KLAIM BBM (MENDUKUNG MODE INDUK & MODE TUNGGAL)
// ============================================================
async function initKlaimBBM() {
  const params = new URLSearchParams(window.location.search);
  const mode = params.get('mode') || 'single';
  globalMode = mode;

  // ==========================================================
  // MODE INDUK: TAMPILKAN SEMUA TIM & TIKET BERDAMPINGAN
  // ==========================================================
  if (mode === 'induk') {
    document.getElementById('badgeMode').innerHTML = '<i class="fas fa-layer-group"></i> View Induk (Semua Tim)';
    const stored = sessionStorage.getItem('klaim_bbm_induk_data');
    if (!stored) {
      document.getElementById('sheetsContainer').innerHTML = `
        <div style="background:white;padding:40px;border-radius:12px;text-align:center;max-width:500px;margin:40px auto;color:#64748b;">
          <i class="fas fa-exclamation-circle" style="font-size:36px;color:#cbd5e1;margin-bottom:10px;"></i>
          <div style="font-weight:700;font-size:15px;color:#1e293b;">Data View Induk tidak ditemukan</div>
          <div style="font-size:12px;margin-top:4px;">Silakan buka kembali melalui tombol "View Induk Klaim BBM" di menu Rekap.</div>
        </div>`;
      return;
    }

    try {
      const indukData = JSON.parse(stored);
      globalPeriode = indukData.periode || '-';

      // Kumpulkan seluruh ticketid unik dari semua grup
      const allTicketIds = [];
      indukData.groups.forEach(g => {
        (g.ticketIds || []).forEach(tid => {
          if (!allTicketIds.includes(tid)) allTicketIds.push(tid);
        });
      });

      if (allTicketIds.length === 0) {
        throw new Error('Tidak ada tiket yang valid.');
      }

      // Ambil seluruh data tiket dalam satu query Supabase
      const { data: rawTickets, error } = await sb
        .from('tickets')
        .select('*')
        .in('ticketid', allTicketIds)
        .order('createdAt', { ascending: true });

      if (error) throw error;

      // Buat map tiket
      const ticketMap = {};
      (rawTickets || []).forEach(t => {
        ticketMap[t.ticketid] = t;
      });

      const vouchers = [];
      const MAX_TICKETS = 10;

      // Iterasi setiap grup tim dari data induk
      indukData.groups.forEach(group => {
        const gTickets = (group.ticketIds || []).map(id => ticketMap[id]).filter(Boolean);
        const teamTechs = group.r2Techs || [];

        const dateInput = gTickets[0]?.createdAt || Date.now();
        const hari = getHariIndo(dateInput);
        const tanggal = getTglIndo(dateInput);

        // Pecah teknisi tim menjadi motor units (maksimal 2 orang per motor R2)
        // Jika 3 orang: Motor 1 (2 orang), Motor 2 (1 orang -> Form Sendiri!)
        const motorUnits = [];
        if (teamTechs.length === 0) {
          motorUnits.push(['-']);
        } else {
          for (let i = 0; i < teamTechs.length; i += 2) {
            motorUnits.push(teamTechs.slice(i, i + 2));
          }
        }

        // Untuk setiap unit motor, buatkan kupon form
        motorUnits.forEach(mTechs => {
          for (let i = 0; i < gTickets.length; i += MAX_TICKETS) {
            const sliceTickets = gTickets.slice(i, i + MAX_TICKETS);
            const sliceJenis = Array.from(new Set(sliceTickets.map(t => (t.jenistiket || 'GGN').toUpperCase())));

            vouchers.push({
              timLabel: group.timLabel,
              hari: hari,
              tanggal: tanggal,
              tickets: sliceTickets,
              kebutuhan: sliceJenis,
              petugas: mTechs
            });
          }
        });
      });

      globalSheetsData = vouchers;

      // Bagi per 4 kupon per lembar A4 (Grid 2x2: Tim 1 samping Tim 2)
      const sheets = [];
      for (let i = 0; i < vouchers.length; i += 4) {
        sheets.push(vouchers.slice(i, i + 4));
      }

      const sheetsHtml = sheets.map((s, idx) => renderA4Sheet(s, idx + 1, sheets.length)).join('');
      document.getElementById('sheetsContainer').innerHTML = sheetsHtml;

      document.getElementById('toolbarSub').innerHTML = `
        <strong>${indukData.groups.length} Tim Terdaftar</strong> &nbsp;•&nbsp; 
        Total: <strong>${allTicketIds.length} Tiket</strong> &nbsp;•&nbsp; 
        <strong>${vouchers.length} Kupon Form</strong> (${sheets.length} Lembar A4)
      `;

    } catch (e) {
      console.error('Error load induk:', e);
      document.getElementById('sheetsContainer').innerHTML = `
        <div style="background:white;padding:30px;border-radius:12px;text-align:center;max-width:500px;margin:40px auto;color:#dc2626;">
          <i class="fas fa-exclamation-triangle" style="font-size:32px;margin-bottom:8px;"></i>
          <div style="font-weight:700;">Gagal memuat data induk: ${e.message}</div>
        </div>`;
    }
    return;
  }

  // ==========================================================
  // MODE TUNGGAL (KLIK TOMBOL KLAIM BBM DI 1 BARIS TIM)
  // ==========================================================
  const ticketIds = (params.get('tickets') || '').split(',').map(x => x.trim()).filter(Boolean);
  const timLabel = params.get('tim') || 'Tim';
  globalPeriode = params.get('periode') || '-';

  if (ticketIds.length === 0) {
    document.getElementById('sheetsContainer').innerHTML = `
      <div style="background:white;padding:50px;border-radius:12px;text-align:center;max-width:500px;margin:40px auto;color:#64748b;">
        <i class="fas fa-info-circle" style="font-size:36px;color:#cbd5e1;margin-bottom:12px;"></i>
        <div style="font-size:15px;font-weight:700;color:#1e293b;">Tidak ada tiket yang dipilih</div>
      </div>`;
    return;
  }

  try {
    const { data: rawTickets, error } = await sb
      .from('tickets')
      .select('*')
      .in('ticketid', ticketIds)
      .order('createdAt', { ascending: true });

    if (error) throw error;
    if (!rawTickets || rawTickets.length === 0) {
      throw new Error('Data tiket tidak ditemukan.');
    }

    let teamTechs = [];
    if (timLabel && timLabel !== 'Tim') {
      teamTechs = timLabel.split(/[,&|\n]+/).map(s => s.trim()).filter(Boolean);
    }
    if (teamTechs.length === 0 && rawTickets[0].technicians) {
      teamTechs = rawTickets[0].technicians;
    }

    // Filter tiket yang berstatus kendaraan R2 (Motor)
    const r2Tickets = rawTickets.filter(t => (localStorage.getItem('ticket_vehicle_' + (t.ticketid || t.id)) || 'R2').toUpperCase() === 'R2');
    const finalTickets = r2Tickets.length > 0 ? r2Tickets : rawTickets;
    const finalTechs = teamTechs.length > 0 ? teamTechs : (rawTickets[0].technicians || ['-']);

    const dateInput = finalTickets[0].createdAt || Date.now();
    const hari = getHariIndo(dateInput);
    const tanggal = getTglIndo(dateInput);

    const MAX_TICKETS = 10;
    const vouchers = [];

    // Pecah motor: maks 2 orang per motor (teknisi ke-3 dibuatkan form sendiri)
    const motorUnits = [];
    if (finalTechs.length === 0) {
      motorUnits.push(['-']);
    } else {
      for (let i = 0; i < finalTechs.length; i += 2) {
        motorUnits.push(finalTechs.slice(i, i + 2));
      }
    }

    motorUnits.forEach(mTechs => {
      for (let i = 0; i < finalTickets.length; i += MAX_TICKETS) {
        const sliceTickets = finalTickets.slice(i, i + MAX_TICKETS);
        const sliceJenis = Array.from(new Set(sliceTickets.map(t => (t.jenistiket || 'GGN').toUpperCase())));

        vouchers.push({
          timLabel: timLabel,
          hari: hari,
          tanggal: tanggal,
          tickets: sliceTickets,
          kebutuhan: sliceJenis,
          petugas: mTechs
        });
      }
    });

    globalSheetsData = vouchers;

    const sheets = [];
    for (let i = 0; i < vouchers.length; i += 4) {
      sheets.push(vouchers.slice(i, i + 4));
    }

    const sheetsHtml = sheets.map((s, idx) => renderA4Sheet(s, idx + 1, sheets.length)).join('');
    document.getElementById('sheetsContainer').innerHTML = sheetsHtml;

    document.getElementById('toolbarSub').innerHTML = `
      Tim: <strong>${finalTechs.join(', ') || timLabel}</strong> &nbsp;•&nbsp; 
      <strong>${motorUnits.length} Motor</strong> &nbsp;•&nbsp; 
      Total: <strong>${rawTickets.length} Tiket</strong> &nbsp;•&nbsp; 
      <strong>${vouchers.length} Kupon Form</strong> (${sheets.length} Lembar A4)
    `;

  } catch (err) {
    console.error('Error load:', err);
    document.getElementById('sheetsContainer').innerHTML = `
      <div style="background:white;padding:30px;border-radius:12px;text-align:center;max-width:500px;margin:40px auto;color:#dc2626;">
        <i class="fas fa-exclamation-triangle" style="font-size:32px;margin-bottom:8px;"></i>
        <div style="font-weight:700;">Gagal memuat data: ${err.message}</div>
      </div>`;
  }
}

// ============================================================
// DOWNLOAD EXCEL (.XLSX) — SESUAI TEMPLATE CSV ASLI
// ============================================================
function downloadXLSX() {
  if (!globalSheetsData || globalSheetsData.length === 0) return;

  try {
    const wb = XLSX.utils.book_new();

    function hasData(v) {
      return !!(v && ((v.petugas && v.petugas.length > 0 && v.petugas[0] && v.petugas[0] !== '-') || (v.tickets && v.tickets.length > 0)));
    }

    for (let sIdx = 0; sIdx < globalSheetsData.length; sIdx += 4) {
      const v0 = globalSheetsData[sIdx];
      const v1 = globalSheetsData[sIdx + 1];
      const v2 = globalSheetsData[sIdx + 2];
      const v3 = globalSheetsData[sIdx + 3];

      const rows = [];

      function append2Vouchers(va, vb) {
        const hasA = hasData(va);
        const hasB = hasData(vb);
        if (!hasA && !hasB) return;

        const kopTitleA = hasA ? 'PT MAHAWIRA NUSANTARA GRUP' : '';
        const kopAddrA  = hasA ? 'Perum Graha Park Residence Blok C22 Sukodono' : '';
        const kopPhoneA = hasA ? 'Lumajang ( 0821 3926 4405 )' : '';
        const hariA = hasA ? ('HARI : ' + (va.hari || '')) : '';
        const tglA  = hasA ? ('TGL : ' + (va.tanggal || '')) : '';
        const thTiketA = hasA ? 'ID TIKET' : '';
        const thPlgA   = hasA ? 'ID PLG' : '';
        const thLokA   = hasA ? 'LOKASI' : '';

        const kopTitleB = hasB ? 'PT MAHAWIRA NUSANTARA GRUP' : '';
        const kopAddrB  = hasB ? 'Perum Graha Park Residence Blok C22 Sukodono' : '';
        const kopPhoneB = hasB ? 'Lumajang ( 0821 3926 4405 )' : '';
        const hariB = hasB ? ('HARI : ' + (vb.hari || '')) : '';
        const tglB  = hasB ? ('TGL : ' + (vb.tanggal || '')) : '';
        const thTiketB = hasB ? 'ID TIKET' : '';
        const thPlgB   = hasB ? 'ID PLG' : '';
        const thLokB   = hasB ? 'LOKASI' : '';

        rows.push(['', kopTitleA, '', '', '', '', '', kopTitleB, '', '']);
        rows.push(['', kopAddrA, '', '', '', '', '', kopAddrB, '', '']);
        rows.push(['', kopPhoneA, '', '', '', '', '', kopPhoneB, '', '']);
        rows.push([]);
        rows.push([]);
        rows.push([hariA, '', '', tglA, '', '', hariB, '', '', tglB]);
        rows.push([thTiketA, '', '', thPlgA, thLokA, '', thTiketB, '', '', thPlgB, thLokB]);

        // 10 Baris Tiket
        for (let i = 0; i < 10; i++) {
          const ta = (hasA && va.tickets) ? va.tickets[i] : null;
          const tb = (hasB && vb.tickets) ? vb.tickets[i] : null;
          rows.push([
            ta ? ta.ticketid || '' : '', '', '',
            ta ? extractKodePlg(ta) : '',
            ta ? extractLokasi(ta) : '',
            '',
            tb ? tb.ticketid || '' : '', '', '',
            tb ? extractKodePlg(tb) : '',
            tb ? extractLokasi(tb) : ''
          ]);
        }

        // Kebutuhan 1, 2, 3
        const ka = (hasA && va.kebutuhan) ? va.kebutuhan : [];
        const kb = (hasB && vb.kebutuhan) ? vb.kebutuhan : [];
        rows.push([hasA ? 'KEBUTUHAN' : '', hasA ? '1' : '', ka[0] || '', '', '', '', hasB ? 'KEBUTUHAN' : '', hasB ? '1' : '', kb[0] || '', '', '']);
        rows.push(['', hasA ? '2' : '', ka[1] || '', '', '', '', '', hasB ? '2' : '', kb[1] || '', '', '']);
        rows.push(['', hasA ? '3' : '', ka[2] || '', '', '', '', '', hasB ? '3' : '', kb[2] || '', '', '']);

        // Petugas 1 & 2
        const pa = (hasA && va.petugas) ? va.petugas : [];
        const pb = (hasB && vb.petugas) ? vb.petugas : [];
        rows.push([hasA ? 'PETUGAS' : '', hasA ? '1' : '', pa[0] || '', '', '', '', hasB ? 'PETUGAS' : '', hasB ? '1' : '', pb[0] || '', '', '']);
        rows.push(['', hasA ? '2' : '', pa[1] || '', '', '', '', '', hasB ? '2' : '', pb[1] || '', '', '']);

        // NOC di bawah sendiri
        rows.push([]);
        rows.push([]);
        rows.push(['', '', '', hasA ? 'NOC' : '', '', '', '', '', '', hasB ? 'NOC' : '']);
        rows.push([]);
        rows.push([]);
      }

      if (hasData(v0) || hasData(v1)) append2Vouchers(v0, v1);
      if (hasData(v2) || hasData(v3)) append2Vouchers(v2, v3);

      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = [
        { wch: 14 }, { wch: 4 }, { wch: 16 }, { wch: 12 }, { wch: 22 },
        { wch: 4 },
        { wch: 14 }, { wch: 4 }, { wch: 16 }, { wch: 12 }, { wch: 22 }
      ];
      XLSX.utils.book_append_sheet(wb, ws, `Halaman ${Math.floor(sIdx / 4) + 1}`);
    }

    XLSX.writeFile(wb, `Klaim_BBM_R2_${Date.now()}.xlsx`);
    Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'File Excel (.xlsx) berhasil diunduh', timer: 1800, showConfirmButton: false });
  } catch (e) {
    Swal.fire('Gagal Export Excel', e.message, 'error');
  }
}

// ============================================================
// DOWNLOAD PNG
// ============================================================
async function downloadPNG() {
  const container = document.getElementById('sheetsContainer');
  const sheets = container.querySelectorAll('.klaim-sheet');
  if (sheets.length === 0) return;

  Swal.fire({ title: 'Menyiapkan Gambar PNG...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

  try {
    const canvases = [];
    for (const sheet of sheets) {
      const c = await html2canvas(sheet, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
      canvases.push(c);
    }

    const totalW = Math.max(...canvases.map(c => c.width));
    const totalH = canvases.reduce((sum, c) => sum + c.height, 0);

    const merged = document.createElement('canvas');
    merged.width = totalW;
    merged.height = totalH;
    const ctx = merged.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, totalW, totalH);

    let y = 0;
    canvases.forEach(c => {
      ctx.drawImage(c, 0, y);
      y += c.height;
    });

    merged.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Klaim_BBM_R2_${Date.now()}.png`;
      a.click();
      URL.revokeObjectURL(url);
      Swal.close();
      Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Gambar PNG berhasil diunduh', timer: 1800, showConfirmButton: false });
    }, 'image/png');
  } catch (e) {
    Swal.close();
    Swal.fire('Gagal Export PNG', e.message, 'error');
  }
}

// INIALISASI KETIKA SUPABASE SIAP (HANYA SEKALI & CEGAH LOOP)
let _initDone = false;
function triggerInit() {
  if (_initDone) return;
  _initDone = true;
  initKlaimBBM();
}

document.addEventListener('DOMContentLoaded', () => {
  if (window.sb) {
    triggerInit();
    return;
  }
  let attempts = 0;
  const waitSb = setInterval(() => {
    attempts++;
    if (window.sb || attempts > 20) {
      clearInterval(waitSb);
      triggerInit();
    }
  }, 100);
});
</script>
